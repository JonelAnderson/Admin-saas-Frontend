<div class="row btn-page">
  <div class="col-sm-12">
    <div class="card">
      <app-page-header icon="icon-user-check" title="GESTIÓN DE USUARIOS"
        subtitle="Cuentas de acceso, roles y seguridad (MFA) de cada usuario">
        <app-filter-by-state headerFilters #stateFilter [currentMenu]="component.filters.stateFilter"
          [items]="component.menuItems" (filterChange)="setData($event)">
        </app-filter-by-state>

        <app-search-box-multiple headerFilters #searchBox [searchOptions]="component.searchOptions"
          (search)="search($event)" [currentValue]="component.filters.textFilter">
        </app-search-box-multiple>

        <app-button-reset-filters headerActions (buttonClick)="resetFilters()"></app-button-reset-filters>
        @if (canCreate()) {
        <button headerActions type="button" class="btn btn-primary" matTooltip="Agregar" (click)="OpenModalRegister()">
          <em class="feather icon-plus"></em>AGREGAR
        </button>
        }
      </app-page-header>

      <div class="card-body p-0">
        <app-list-table #listTable (actionTriggered)="onActionTriggered($event)" [service]="_userService"
          [columns]="component.tableColumns" [getInputs]="getInputs()" [actions]="tableActions">
        </app-list-table>
      </div>
    </div>
  </div>
</div>
